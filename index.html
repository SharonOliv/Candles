<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blow the Candles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#dcefff;color:#2b1c3a;font-family:'Quicksand',sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{padding:24px;max-width:700px;width:100%}
h1{font-family:'Fredericka the Great',cursive;font-weight:400;font-size:2.5rem;letter-spacing:.5px;color:#d9488f;text-shadow:2px 2px 0 rgba(255,202,58,.5);margin:0 0 32px;min-height:1.4em}

.row{display:flex;justify-content:center;align-items:flex-end;gap:clamp(2px,1.5vw,10px);flex-wrap:nowrap;margin-bottom:34px;width:100%}
.candle{position:relative;width:clamp(30px,12vw,46px);flex:0 1 clamp(30px,12vw,46px)}
.candle>svg:not(.flame){width:100%;height:auto;display:block}

.flame-wrap{position:relative;width:22px;height:40px;margin:0 auto -14px}
.flame{width:22px!important;height:40px!important;display:block;transform-origin:50% 100%;animation:flicker .35s ease-in-out infinite alternate;transition:opacity .35s ease,transform .5s ease}
.flame.blowing{animation:blowLean .15s ease-in-out infinite alternate}
.flame.out{opacity:0;transform:scale(.15) translateY(10px) rotate(20deg)}
@keyframes flicker{from{transform:scaleY(1) rotate(-2deg)}to{transform:scaleY(1.04) rotate(2deg)}}
@keyframes blowLean{from{transform:scaleY(.9) rotate(-25deg) skewX(-5deg)}to{transform:scaleY(1) rotate(-40deg) skewX(-8deg)}}

.smoke{position:absolute;left:50%;top:4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:rgba(160,160,175,.55);opacity:0;pointer-events:none}
.smoke.rise{animation:smokeRise 1.3s ease-out 1}
@keyframes smokeRise{0%{opacity:.7;transform:translateY(0) scale(1)}40%{opacity:.5;transform:translateY(-16px) scale(1.6)}100%{opacity:0;transform:translateY(-46px) scale(2.6)}}

.puff{position:absolute;left:50%;top:6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,0));opacity:0;pointer-events:none}
.puff.burst{animation:puffBurst .5s ease-out 1}
@keyframes puffBurst{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(9)}}

button{margin-top:6px;font-size:1.15rem;padding:13px 28px;border-radius:999px;border:none;cursor:pointer;background:#ff9a3c;color:#2b1200;font-family:'Fredericka the Great',cursive;font-weight:400;letter-spacing:.3px;box-shadow:0 4px 14px rgba(255,154,60,.4)}
button:disabled{opacity:.5;cursor:default;box-shadow:none}
.status{margin-top:14px;font-size:.85rem;color:#5a6b85;min-height:1.2em}

@media(max-width:500px){
.wrap{padding:12px}
h1{font-size:2rem;margin-bottom:26px}
.row{gap:3px}
.candle{width:38px;max-width:38px;flex:0 1 38px}
.flame-wrap{width:18px;height:29px;margin:0 auto -10px}
.flame{width:18px!important;height:29px!important}
button{font-size:1rem;padding:12px 22px}
}
@media(max-width:360px){
.wrap{padding:8px}
.row{gap:1px}
.candle{width:34px;max-width:34px;flex-basis:34px}
.flame-wrap{width:16px;height:26px;margin-bottom:-9px}
.flame{width:16px!important;height:26px!important}
h1{font-size:1.8rem}
}
</style>
</head>
<body>
<div class="wrap">
<h1 id="msg">Blow the candles</h1>
<div class="row" id="candleRow"></div>
<button id="btn">Blow the candles 🎂</button>
<div class="status" id="status"></div>
</div>

<script>
const PALETTES=[
{body:'#ff6f91',pattern:'#ffe066',type:'stripe'},
{body:'#ffd23f',pattern:'#ffffff',type:'stripe'},
{body:'#4d7cff',pattern:'#ffffff',type:'dot'},
{body:'#3aa655',pattern:'#ffffff',type:'dot'},
{body:'#2f5fd9',pattern:'#ffffff',type:'stripe'},
{body:'#ff8a5b',pattern:'#ffffff',type:'stripe'},
{body:'#ff7fb0',pattern:'#ffffff',type:'stripe'}
];

function candleSVG({body,pattern,type},id){
const patternId='pat'+id;
const patternDef=type==='stripe'
?`<pattern id="${patternId}" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="${body}"/><rect width="5" height="12" fill="${pattern}"/></pattern>`
:`<pattern id="${patternId}" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="${body}"/><circle cx="7" cy="7" r="2.8" fill="${pattern}"/></pattern>`;
return `<svg viewBox="0 0 46 190" width="46" height="190"><defs>${patternDef}</defs><polygon points="8,40 38,40 23,8" fill="url(#${patternId})"/><rect x="8" y="38" width="30" height="148" rx="3" fill="url(#${patternId})"/><rect x="21" y="4" width="2" height="8" fill="#5a4636"/></svg>`;
}

const row=document.getElementById('candleRow');

PALETTES.forEach((p,i)=>{
const wrap=document.createElement('div');
wrap.className='candle';
wrap.innerHTML=`<div class="flame-wrap"><div class="smoke" id="smoke${i}"></div><div class="puff" id="puff${i}"></div><svg class="flame" id="flame${i}" viewBox="0 0 50 80" xmlns="http://www.w3.org/2000/svg"><path d="M25 78 C12 76 5 66 7 52 C8 42 15 35 18 27 C21 20 21 11 20 2 C32 10 39 21 37 32 C42 27 44 25 45 22 C48 34 49 45 46 55 C43 69 35 77 25 78Z" fill="#F5A900"/><path d="M25 77 C17 74 13 67 14 58 C15 51 20 46 22 39 C24 34 24 28 23 24 C30 30 34 38 33 45 C36 42 38 39 39 36 C41 47 40 56 37 64 C34 72 30 76 25 77Z" fill="#FFD21F"/></svg></div>`+candleSVG(p,i);
row.appendChild(wrap);
});

const flameEls=PALETTES.map((_,i)=>document.getElementById('flame'+i));
const smokeEls=PALETTES.map((_,i)=>document.getElementById('smoke'+i));
const puffEls=PALETTES.map((_,i)=>document.getElementById('puff'+i));
const msg=document.getElementById('msg');
const btn=document.getElementById('btn');
const statusEl=document.getElementById('status');

let audioCtx=null,analyser=null,stream=null,rafId=null,micTimeout=null,blowStreak=0;
const THRESHOLD=.10,FRAMES_NEEDED=5,MIC_IDLE_TIME=60000;

function resetMicTimeout(){
clearTimeout(micTimeout);
micTimeout=setTimeout(stopMicrophone,MIC_IDLE_TIME);
}

function stopMicrophone(){
cancelAnimationFrame(rafId);
rafId=null;
if(stream){
stream.getTracks().forEach(track=>track.stop());
stream=null;
}
if(audioCtx){
audioCtx.close();
audioCtx=null;
}
analyser=null;
blowStreak=0;
}

async function ensureMicAccess(){
if(stream){
resetMicTimeout();
return true;
}
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
statusEl.textContent='This browser/context does not support microphone access.';
return false;
}
try{
stream=await navigator.mediaDevices.getUserMedia({audio:true});
}catch(err){
statusEl.textContent='Mic access denied — check browser permissions and try again.';
return false;
}
audioCtx=new(window.AudioContext||window.webkitAudioContext)();
const source=audioCtx.createMediaStreamSource(stream);
analyser=audioCtx.createAnalyser();
analyser.fftSize=1024;
source.connect(analyser);
resetMicTimeout();
return true;
}

function setBlowing(isBlowing){
flameEls.forEach(f=>f.classList.toggle('blowing',isBlowing));
}

function checkVolume(){
if(!analyser)return;
resetMicTimeout();
const data=new Uint8Array(analyser.fftSize);
analyser.getByteTimeDomainData(data);
let sumSquares=0;
for(let i=0;i<data.length;i++){
const norm=(data[i]-128)/128;
sumSquares+=norm*norm;
}
const rms=Math.sqrt(sumSquares/data.length);
if(rms>THRESHOLD){
setBlowing(true);
blowStreak++;
if(blowStreak>=FRAMES_NEEDED){
candlesBlownOut();
return;
}
}else{
setBlowing(false);
blowStreak=Math.max(0,blowStreak-1);
}
rafId=requestAnimationFrame(checkVolume);
}

function candlesBlownOut(){
cancelAnimationFrame(rafId);
rafId=null;
setBlowing(false);
resetMicTimeout();

flameEls.forEach((f,i)=>{
f.classList.add('out');
puffEls[i].classList.add('burst');
smokeEls[i].classList.add('rise');
});

msg.textContent='Voila!';

setTimeout(()=>{
msg.textContent='Wanna try again?';
btn.textContent='Blow the candles again 🎂';
btn.disabled=false;
},1000);
}

btn.addEventListener('click',async()=>{
btn.disabled=true;
statusEl.textContent='';
msg.textContent='Blow the candles';

flameEls.forEach(f=>f.classList.remove('out'));
puffEls.forEach(p=>p.classList.remove('burst'));
smokeEls.forEach(s=>s.classList.remove('rise'));

const ok=await ensureMicAccess();

if(!ok){
btn.disabled=false;
return;
}

blowStreak=0;
resetMicTimeout();
checkVolume();
});
</script>
</body>
</html>
